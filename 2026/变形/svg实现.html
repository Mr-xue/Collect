<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正弦曲线文字排版（SVG版）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Pacifico&family=Lobster&family=Satisfy&family=Permanent+Marker&family=Righteous&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }

        .controls {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }

        .controls-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        textarea {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
            line-height: 1.6;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        /* SVG 容器样式，对应原 canvas 样式 */
        #svgCanvas {
            display: block;
            width: 100%;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
        }

        .style-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .style-btn {
            padding: 7px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
            transition: all 0.2s ease;
            user-select: none;
            color: #555;
            min-width: 38px;
            text-align: center;
        }

        .style-btn:hover:not(.active) {
            border-color: #667eea;
            color: #667eea;
        }

        .style-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .bold-btn      { font-weight: 900; }
        .italic-btn    { font-style: italic; font-weight: bold; }
        .underline-btn { text-decoration: underline; font-weight: bold; }

        .hint-text {
            font-size: 12px;
            color: #999;
            font-weight: normal;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 曲线文字排版工具（SVG版）</h1>

        <div class="controls">
            <div class="control-group">
                <label for="shapeSelect">曲线类型：</label>
                <select id="shapeSelect">
                    <option value="sine">正弦波浪</option>
                    <option value="arc">圆弧曲线（顶部）</option>
                    <option value="arc-bottom">圆弧曲线（底部）</option>
                </select>
            </div>

            <div class="control-group">
                <label for="textInput">
                    输入文字：<span class="hint-text">按 Enter 回车换行，多行各自独立渲染</span>
                </label>
                <textarea id="textInput" placeholder="输入你想要显示的文字，按 Enter 换行">Hello World!
欢迎使用曲线文字效果！</textarea>
            </div>

            <div class="controls-row">
                <div class="control-group">
                    <label for="fontFamilySelect">字体：</label>
                    <select id="fontFamilySelect">
                        <optgroup label="── 无衬线体 ──">
                            <option value="Arial, sans-serif">Arial</option>
                            <option value="Verdana, sans-serif">Verdana</option>
                            <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
                            <option value="Impact, Haettenschweiler, sans-serif">Impact</option>
                        </optgroup>
                        <optgroup label="── 衬线体 ──">
                            <option value="Georgia, serif">Georgia</option>
                            <option value="'Times New Roman', Times, serif">Times New Roman</option>
                            <option value="Palatino, 'Palatino Linotype', serif">Palatino</option>
                        </optgroup>
                        <optgroup label="── 等宽字体 ──">
                            <option value="'Courier New', Courier, monospace">Courier New</option>
                        </optgroup>
                        <optgroup label="── 手写 / 装饰体 ──">
                            <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
                            <option value="'Dancing Script', cursive">Dancing Script ✦</option>
                            <option value="'Pacifico', cursive">Pacifico ✦</option>
                            <option value="'Lobster', cursive">Lobster ✦</option>
                            <option value="'Satisfy', cursive">Satisfy ✦</option>
                            <option value="'Permanent Marker', cursive">Permanent Marker ✦</option>
                            <option value="'Righteous', cursive">Righteous ✦</option>
                        </optgroup>
                        <optgroup label="── 中文字体 ──">
                            <option value="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif">微软雅黑</option>
                            <option value="'SimSun', 'STSong', 'Noto Serif SC', serif">宋体</option>
                            <option value="'SimHei', 'STHeiti', 'Noto Sans SC', sans-serif">黑体</option>
                            <option value="'KaiTi', 'STKaiti', cursive">楷体</option>
                            <option value="'FangSong', 'STFangsong', serif">仿宋</option>
                        </optgroup>
                    </select>
                </div>

                <div class="control-group">
                    <label>字体样式：</label>
                    <div class="style-buttons">
                        <button class="style-btn bold-btn"      id="boldBtn"      title="粗体 (Bold)">B</button>
                        <button class="style-btn italic-btn"    id="italicBtn"    title="斜体 (Italic)">I</button>
                        <button class="style-btn underline-btn" id="underlineBtn" title="下划线 (Underline)">U</button>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label for="amplitudeSlider"><span id="amplitudeLabel">波浪幅度</span>：<span id="amplitudeValue">40</span>px</label>
                <input type="range" id="amplitudeSlider" min="0" max="100" value="40">
            </div>

            <div class="control-group" id="frequencyGroup">
                <label for="frequencySlider">波浪频率：<span id="frequencyValue">0.020</span></label>
                <input type="range" id="frequencySlider" min="5" max="50" value="20">
            </div>

            <div class="control-group">
                <label for="spacingSlider">字符间距：<span id="spacingValue">20</span>px</label>
                <input type="range" id="spacingSlider" min="10" max="50" value="20">
            </div>

            <div class="control-group">
                <label for="fontSizeSlider">字体大小：<span id="fontSizeValue">24</span>px</label>
                <input type="range" id="fontSizeSlider" min="12" max="48" value="24">
            </div>
        </div>

        <!-- SVG 替代 Canvas，viewBox 动态设置，width="100%" 响应式缩放 -->
        <svg id="svgCanvas" xmlns="http://www.w3.org/2000/svg"
             width="100%"
             viewBox="0 0 840 200"
             preserveAspectRatio="xMidYMid meet">
        </svg>
    </div>

    <script>
        const svg = document.getElementById('svgCanvas');
        const SVG_NS = 'http://www.w3.org/2000/svg';
        const LOGICAL_WIDTH = 840;

        // ─── 控件引用 ────────────────────────────────────────────────────────────
        const shapeSelect      = document.getElementById('shapeSelect');
        const textInput        = document.getElementById('textInput');
        const fontFamilySelect = document.getElementById('fontFamilySelect');
        const boldBtn          = document.getElementById('boldBtn');
        const italicBtn        = document.getElementById('italicBtn');
        const underlineBtn     = document.getElementById('underlineBtn');
        const amplitudeSlider  = document.getElementById('amplitudeSlider');
        const frequencySlider  = document.getElementById('frequencySlider');
        const spacingSlider    = document.getElementById('spacingSlider');
        const fontSizeSlider   = document.getElementById('fontSizeSlider');
        const amplitudeLabel   = document.getElementById('amplitudeLabel');
        const amplitudeValue   = document.getElementById('amplitudeValue');
        const frequencyValue   = document.getElementById('frequencyValue');
        const spacingValue     = document.getElementById('spacingValue');
        const fontSizeValue    = document.getElementById('fontSizeValue');

        // ─── 字体样式状态 ────────────────────────────────────────────────────────
        let isBold      = false;
        let isItalic    = false;
        let isUnderline = false;

        // ─── SVG 工具函数 ────────────────────────────────────────────────────────

        /**
         * 创建带属性的 SVG 元素
         */
        const createEl = (tag, attrs, textContent) => {
            const el = document.createElementNS(SVG_NS, tag);
            for (const [k, v] of Object.entries(attrs)) {
                el.setAttribute(k, v);
            }
            if (textContent !== undefined) el.textContent = textContent;
            return el;
        };

        /**
         * 清空 SVG 内容并更新 viewBox 高度
         */
        const resetSVG = (height) => {
            while (svg.firstChild) svg.removeChild(svg.firstChild);
            svg.setAttribute('viewBox', `0 0 ${LOGICAL_WIDTH} ${height}`);
        };

        // ─── 字符绘制 ────────────────────────────────────────────────────────────

        /**
         * 在曲线上放置单个 SVG <text> 字符
         * transform="translate(x,y) rotate(deg)" 等价于 canvas 的 translate→rotate
         * text-anchor="middle" + dominant-baseline="central" = canvas textBaseline:'middle' + 水平居中
         *
         * @param {string} char
         * @param {number} x        - 曲线上该字符的全局坐标 x
         * @param {number} y        - 曲线上该字符的全局坐标 y
         * @param {number} angleRad - 旋转角（弧度）
         * @param {number} fontSize
         * @param {string} fontFamily
         * @param {string} color
         */
        const makeSVGChar = (char, x, y, angleRad, fontSize, fontFamily, color = '#333') => {
            const angleDeg = angleRad * 180 / Math.PI;
            const attrs = {
                transform:          `translate(${x}, ${y}) rotate(${angleDeg})`,
                'text-anchor':      'middle',
                'dominant-baseline':'central',
                'font-family':      fontFamily,
                'font-size':        `${fontSize}px`,
                fill:               color,
            };
            if (isBold)   attrs['font-weight'] = 'bold';
            if (isItalic) attrs['font-style']  = 'italic';
            return createEl('text', attrs, char);
        };

        // ─── 下划线路径 ──────────────────────────────────────────────────────────

        /**
         * 正弦波连续下划线：沿切线法线方向偏移，逐步采样生成 SVG <path>
         */
        const makeSineUnderlinePath = (text, amplitude, frequency, spacing, startX, centerY, fontSize, color = '#333') => {
            if (!text.trim()) return null;

            const offset        = fontSize * 0.38;
            const lineThickness = Math.max(1, fontSize / 16);
            const xEnd          = startX + (text.length - 1) * spacing;

            const pts = [];
            let first = true;
            for (let px = startX; px <= xEnd + 0.5; px += 0.5) {
                const cx    = Math.min(px, xEnd);
                const sinY  = centerY + amplitude * Math.sin(frequency * cx);
                const deriv = amplitude * frequency * Math.cos(frequency * cx);
                const ang   = Math.atan2(deriv, 1);
                const wx    = cx - offset * Math.sin(ang);
                const wy    = sinY + offset * Math.cos(ang);
                pts.push(first ? `M ${wx} ${wy}` : `L ${wx} ${wy}`);
                first = false;
            }

            return createEl('path', {
                d:                   pts.join(' '),
                stroke:              color,
                'stroke-width':      lineThickness,
                'stroke-linecap':    'round',
                'stroke-linejoin':   'round',
                fill:                'none',
            });
        };

        /**
         * 圆弧连续下划线：使用 SVG arc 命令绘制偏移弧段
         * sweep-flag=1 (顺时针) 与 canvas ctx.arc 默认方向一致
         */
        const makeArcUnderlinePath = (text, radius, arcAngle, centerX, centerY, fontSize, isBottomArc = false, color = '#333') => {
            if (!text.trim()) return null;

            const offset          = fontSize * 0.38;
            const underlineRadius = isBottomArc ? radius + offset : radius - offset;
            const lineThickness   = Math.max(1, fontSize / 16);

            // SVG arc 命令无法用单段表示整圆（起终点重合时命令失效），
            // 当圆弧 >= 2π 时改用 <circle> 绘制完整下划线圆。
            if (arcAngle >= 2 * Math.PI) {
                return createEl('circle', {
                    cx:             centerX,
                    cy:             centerY,
                    r:              underlineRadius,
                    stroke:         color,
                    'stroke-width': lineThickness,
                    fill:           'none',
                });
            }

            const startAngle = isBottomArc
                ?  Math.PI / 2 - arcAngle / 2
                : -Math.PI / 2 - arcAngle / 2;
            const endAngle = isBottomArc
                ?  Math.PI / 2 + arcAngle / 2
                : -Math.PI / 2 + arcAngle / 2;

            const x1 = centerX + underlineRadius * Math.cos(startAngle);
            const y1 = centerY + underlineRadius * Math.sin(startAngle);
            const x2 = centerX + underlineRadius * Math.cos(endAngle);
            const y2 = centerY + underlineRadius * Math.sin(endAngle);
            const largeArc = arcAngle > Math.PI ? 1 : 0;

            return createEl('path', {
                d:                `M ${x1} ${y1} A ${underlineRadius} ${underlineRadius} 0 ${largeArc} 1 ${x2} ${y2}`,
                stroke:           color,
                'stroke-width':   lineThickness,
                'stroke-linecap': 'round',
                fill:             'none',
            });
        };

        // ─── 正弦波浪 ────────────────────────────────────────────────────────────

        const getSineLineHeight = (amplitude, fontSize) => fontSize + amplitude * 2 + 50;

        /**
         * 绘制单行正弦波文字到 SVG
         */
        const drawSineWaveLine = (text, amplitude, frequency, spacing, fontSize, fontFamily, offsetY) => {
            const lineHeight = getSineLineHeight(amplitude, fontSize);
            const centerY    = offsetY + lineHeight / 2;
            const totalWidth = text.length * spacing;
            const startX     = Math.max(spacing, (LOGICAL_WIDTH - totalWidth) / 2);

            // 参考正弦辅助线（采样每 1px）
            const refPts = [];
            for (let x = 0; x < LOGICAL_WIDTH; x++) {
                const y = centerY + amplitude * Math.sin(frequency * x);
                refPts.push(x === 0 ? `M ${x} ${y}` : `L ${x} ${y}`);
            }
            svg.appendChild(createEl('path', {
                d:             refPts.join(' '),
                stroke:        'rgba(102, 126, 234, 0.18)',
                'stroke-width':'1.5',
                fill:          'none',
            }));

            // 字符
            for (let i = 0; i < text.length; i++) {
                const x     = startX + i * spacing;
                const y     = centerY + amplitude * Math.sin(frequency * x);
                // 与 canvas 版保持相同：用导数值直接作为弧度角（小角近似）
                const angle = amplitude * frequency * Math.cos(frequency * x);
                svg.appendChild(makeSVGChar(text[i], x, y, angle, fontSize, fontFamily));
            }

            // 下划线（绘制在字符之后，层叠于字符之上，与 canvas 版一致）
            if (isUnderline) {
                const ul = makeSineUnderlinePath(text, amplitude, frequency, spacing, startX, centerY, fontSize);
                if (ul) svg.appendChild(ul);
            }
        };

        // ─── 圆弧曲线 ────────────────────────────────────────────────────────────

        const getArcParams = (text, curvature, spacing) => {
            const totalWidth = text.length * spacing;
            let radius;
            if (curvature === 0) {
                radius = 100000;
            } else {
                radius = 500 - curvature * 4;
                if (radius < 100) radius = 100;
            }
            const arcAngle = totalWidth / radius;
            // 当圆弧超过半圆（arcAngle/2 > π）时，cos 值会从 -1 反向回升，
            // 导致 arcHeight 越来越小甚至归零，容器高度崩塌。
            // 修正：将 halfAngle 钳制在 [0, π]，使 arcHeight 最大为 2*radius（整圆直径）。
            const halfAngle = Math.min(arcAngle / 2, Math.PI);
            const arcHeight = radius - radius * Math.cos(halfAngle);
            return { radius, arcAngle, arcHeight };
        };

        const getArcLineHeight = (text, curvature, spacing, fontSize) => {
            const { arcHeight } = getArcParams(text, curvature, spacing);
            return fontSize + arcHeight + 50;
        };

        /**
         * 绘制单行圆弧文字到 SVG
         */
        const drawArcLine = (text, curvature, spacing, fontSize, fontFamily, offsetY, mode = 'top') => {
            const { radius, arcAngle, arcHeight } = getArcParams(text, curvature, spacing);
            const padding  = 25;
            const centerX  = LOGICAL_WIDTH / 2;
            const isBottom = mode === 'bottom';

            // 圆心坐标（与 canvas 版完全相同）
            const centerY = isBottom
                ? offsetY + padding + arcHeight + fontSize / 2 - radius
                : offsetY + padding + radius;

            // 字符
            for (let i = 0; i < text.length; i++) {
                const angle = -arcAngle / 2 + (i / (text.length - 1 || 1)) * arcAngle;
                let x, y, rot;
                if (isBottom) {
                    x   =  centerX + radius * Math.sin(angle);
                    y   =  centerY + radius * Math.cos(angle);
                    rot = -angle;
                } else {
                    x   = centerX + radius * Math.sin(angle);
                    y   = centerY - radius * Math.cos(angle);
                    rot = angle;
                }
                svg.appendChild(makeSVGChar(text[i], x, y, rot, fontSize, fontFamily));
            }

            // 下划线
            if (isUnderline) {
                const ul = makeArcUnderlinePath(text, radius, arcAngle, centerX, centerY, fontSize, isBottom);
                if (ul) svg.appendChild(ul);
            }

            // 参考圆弧辅助线（SVG arc 命令，sweep-flag=1 顺时针，与 canvas 一致）
            const refStartAngle = isBottom
                ?  Math.PI / 2 - arcAngle / 2
                : -Math.PI / 2 - arcAngle / 2;
            const refEndAngle = isBottom
                ?  Math.PI / 2 + arcAngle / 2
                : -Math.PI / 2 + arcAngle / 2;

            if (arcAngle >= 2 * Math.PI) {
                // arcAngle >= 整圆时，SVG arc 命令起终点重合会失效，改用 <circle>
                svg.appendChild(createEl('circle', {
                    cx:             centerX,
                    cy:             centerY,
                    r:              radius,
                    stroke:         'rgba(102, 126, 234, 0.18)',
                    'stroke-width': '1.5',
                    fill:           'none',
                }));
            } else {
                const rx1      = centerX + radius * Math.cos(refStartAngle);
                const ry1      = centerY + radius * Math.sin(refStartAngle);
                const rx2      = centerX + radius * Math.cos(refEndAngle);
                const ry2      = centerY + radius * Math.sin(refEndAngle);
                const largeArc = arcAngle > Math.PI ? 1 : 0;
                svg.appendChild(createEl('path', {
                    d:             `M ${rx1} ${ry1} A ${radius} ${radius} 0 ${largeArc} 1 ${rx2} ${ry2}`,
                    stroke:        'rgba(102, 126, 234, 0.18)',
                    'stroke-width':'1.5',
                    fill:          'none',
                }));
            }
        };

        // ─── 主绘制入口（支持多行）────────────────────────────────────────────────

        const LINE_GAP = 10;

        const draw = () => {
            const shape      = shapeSelect.value;
            const lines      = textInput.value.split('\n');
            const amplitude  = parseFloat(amplitudeSlider.value);
            const frequency  = parseFloat(frequencySlider.value) / 1000;
            const spacing    = parseFloat(spacingSlider.value);
            const fontSize   = parseFloat(fontSizeSlider.value);
            const fontFamily = fontFamilySelect.value;

            if (shape === 'sine') {
                const lineHeight  = getSineLineHeight(amplitude, fontSize);
                const totalHeight = Math.max(80, lineHeight * lines.length + LINE_GAP * (lines.length - 1));
                resetSVG(totalHeight);

                lines.forEach((line, i) => {
                    const offsetY = i * (lineHeight + LINE_GAP);
                    drawSineWaveLine(line || ' ', amplitude, frequency, spacing, fontSize, fontFamily, offsetY);
                });
            } else {
                const arcMode    = shape === 'arc-bottom' ? 'bottom' : 'top';
                const lineHeights = lines.map(line => getArcLineHeight(line || ' ', amplitude, spacing, fontSize));
                const totalHeight = Math.max(80,
                    lineHeights.reduce((sum, h) => sum + h, 0) + LINE_GAP * (lines.length - 1)
                );
                resetSVG(totalHeight);

                let offsetY = 0;
                lines.forEach((line, i) => {
                    drawArcLine(line || ' ', amplitude, spacing, fontSize, fontFamily, offsetY, arcMode);
                    offsetY += lineHeights[i] + LINE_GAP;
                });
            }
        };

        // ─── 更新控件显示值 ──────────────────────────────────────────────────────

        const updateValues = () => {
            const shape = shapeSelect.value;

            if (shape === 'sine') {
                amplitudeLabel.textContent = '波浪幅度';
                document.getElementById('frequencyGroup').style.display = 'flex';
            } else {
                amplitudeLabel.textContent = '弧度弯曲';
                document.getElementById('frequencyGroup').style.display = 'none';
            }

            amplitudeValue.textContent = amplitudeSlider.value;
            frequencyValue.textContent = (parseFloat(frequencySlider.value) / 1000).toFixed(3);
            spacingValue.textContent   = spacingSlider.value;
            fontSizeValue.textContent  = fontSizeSlider.value;
        };

        // ─── 事件绑定 ────────────────────────────────────────────────────────────

        boldBtn.addEventListener('click', () => {
            isBold = !isBold;
            boldBtn.classList.toggle('active', isBold);
            draw();
        });

        italicBtn.addEventListener('click', () => {
            isItalic = !isItalic;
            italicBtn.classList.toggle('active', isItalic);
            draw();
        });

        underlineBtn.addEventListener('click', () => {
            isUnderline = !isUnderline;
            underlineBtn.classList.toggle('active', isUnderline);
            draw();
        });

        shapeSelect.addEventListener('change',      () => { updateValues(); draw(); });
        textInput.addEventListener('input',         draw);
        fontFamilySelect.addEventListener('change', draw);

        amplitudeSlider.addEventListener('input', () => { updateValues(); draw(); });
        frequencySlider.addEventListener('input', () => { updateValues(); draw(); });
